# A reviewer answers a checked submission with a label (tools/bot.sh):
#   approved   the checks run once more at the pinned commit; the record goes into
#              submissions/, the database is rebuilt and its version goes up
#   rejected   the issue closes
name: Review a submission
on:
  issues:
    types: [labeled]
permissions:
  issues: write
  contents: write
jobs:
  review:
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'submission') &&
      (github.event.label.name == 'approved' || github.event.label.name == 'rejected')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools (qmllint, aequalyn-store)
        if: github.event.label.name == 'approved'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qt6-declarative-dev-tools >/dev/null
          curl -fsSL https://raw.githubusercontent.com/Aequalyn/aequalyn/main/bin/aequalyn-store -o aequalyn-store
          sudo install -m 755 aequalyn-store /usr/local/bin/aequalyn-store && rm aequalyn-store
      - name: Review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          LABEL: ${{ github.event.label.name }}
          ACTOR: ${{ github.event.sender.login }}
        run: |
          git config user.name "aequalyn-market[bot]"
          git config user.email "aequalyn-market@users.noreply.github.com"
          tools/bot.sh review "$ISSUE" "$LABEL" "$ACTOR"
      # The website (aequalyn-site) rebuilds when the catalog changes. The token is a
      # fine-grained one with Contents: write on aequalyn-site only, kept to this step.
      - name: Tell the website
        if: github.event.label.name == 'approved'
        env:
          SITE_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          [ -n "$SITE_TOKEN" ] || { echo "no SITE_DISPATCH_TOKEN: the site picks the change up on its daily build"; exit 0; }
          curl -fsS -X POST -H "Authorization: Bearer $SITE_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Aequalyn/aequalyn-site/dispatches -d '{"event_type":"market-updated"}'
