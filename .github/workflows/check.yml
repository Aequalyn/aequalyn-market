# Every submission is checked at its pinned commit when it is opened or edited (or from
# here, by hand), the report is posted and its labels are set (tools/bot.sh).
name: Check a submission
on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue:
        description: The issue to check again
        required: true
permissions:
  issues: write
  contents: read
concurrency:
  group: check-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: true
jobs:
  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.state == 'open' && contains(github.event.issue.labels.*.name, 'submission'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools (qmllint, aequalyn-store)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qt6-declarative-dev-tools >/dev/null
          curl -fsSL https://raw.githubusercontent.com/Aequalyn/aequalyn/main/bin/aequalyn-store -o aequalyn-store
          sudo install -m 755 aequalyn-store /usr/local/bin/aequalyn-store && rm aequalyn-store
      - name: Check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
        run: tools/bot.sh check "$ISSUE"
