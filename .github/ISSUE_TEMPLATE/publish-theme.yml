name: Publish a theme
description: Submit a theme to the Aequalyn Market. Read docs/guidelines/theme.md first.
title: "[theme] "
labels: ["submission", "theme"]
body:
  - type: markdown
    attributes:
      value: |
        Read **[the theme guidelines](../blob/main/docs/guidelines/theme.md)** first: the bot checks exactly what they ask,
        at the commit below, and posts its report here. A reviewer then approves or rejects it.
  - type: input
    id: repo
    attributes:
      label: Repository
      description: "The https git URL of your repo, named aequalyn-theme-<id> after its id (see Names and ids in the README)."
      placeholder: https://github.com/you/aequalyn-theme-name
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The full commit id to review. Leave it empty and the bot pins the current head.
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: input
    id: about
    attributes:
      label: About
      description: One line about it.
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License
      placeholder: MIT
    validations:
      required: true
  - type: checkboxes
    id: read
    attributes:
      label: Guidelines
      options:
        - label: I read docs/guidelines/theme.md and `aequalyn-store check theme . --market` passes.
          required: true
