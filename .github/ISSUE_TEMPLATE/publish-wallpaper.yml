name: Publish a wallpaper pack
description: Submit a wallpaper pack to the Aequalyn Market. Read docs/guidelines/wallpaper.md first.
title: "[wallpaper] "
labels: ["submission", "wallpaper"]
body:
  - type: markdown
    attributes:
      value: |
        Read **[the wallpaper guidelines](../blob/main/docs/guidelines/wallpaper.md)** first: the bot checks exactly what they ask,
        at the commit below, and posts its report here. A reviewer then approves or rejects it.
  - type: input
    id: repo
    attributes:
      label: Repository
      description: The https git URL of your repo.
      placeholder: https://github.com/you/aequalyn-wallpaper-name
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The full commit id to review. Leave it empty and the bot pins the current head.
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: input
    id: about
    attributes:
      label: About
      description: One line about it.
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License
      placeholder: MIT
    validations:
      required: true
  - type: checkboxes
    id: read
    attributes:
      label: Guidelines
      options:
        - label: I read docs/guidelines/wallpaper.md and `aequalyn-store check wallpaper . --market` passes.
          required: true
